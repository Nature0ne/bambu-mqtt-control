name: bambu-mqtt-control

services:
  bambu-control:
    image: "${BAMBU_IMAGE:-ghcr.io/nature0ne/bambu-mqtt-control:latest}"
    pull_policy: "${BAMBU_PULL_POLICY:-missing}"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      TZ: "${TZ:-UTC}"
      BAMBU_CONFIG_FILE: /config/printers.yml
      BAMBU_BOOTSTRAP_TOKEN_FILE: /config/bootstrap-token
      BAMBU_AUDIT_DB: /var/lib/bambu-control/audit.sqlite3
      BAMBU_LOG_LEVEL: "${BAMBU_LOG_LEVEL:-INFO}"
    expose:
      - "9208"
    volumes:
      - bambu-config:/config
      - bambu-data:/var/lib/bambu-control
    read_only: true
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          body=urllib.request.urlopen("http://127.0.0.1:9208/healthz", timeout=3).read();
          assert b'"status":"ok"' in body
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      bambu-control:
        condition: service_healthy
    environment:
      BAMBU_SITE_HOST: "${BAMBU_SITE_HOST:-localhost}"
      BAMBU_HTTPS_PORT: "${BAMBU_HTTPS_PORT:-9444}"
    ports:
      - "${BAMBU_BIND_ADDRESS:-127.0.0.1}:${BAMBU_HTTPS_PORT:-9444}:${BAMBU_HTTPS_PORT:-9444}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:2018/healthz |
          grep -q '"status":"ok"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bambu-config:
  bambu-data:
  caddy-data:
  caddy-config:
