name: bambu-mqtt-control

services:
  bambu-control:
    build:
      context: .
    image: bambu-mqtt-control:local
    restart: unless-stopped
    init: true
    environment:
      TZ: "${TZ:-UTC}"
      BAMBU_CONFIG_FILE: /config/printers.yml
      BAMBU_BOOTSTRAP_TOKEN_FILE: /config/bootstrap-token
      BAMBU_AUDIT_DB: /var/lib/bambu-control/audit.sqlite3
      BAMBU_LOG_LEVEL: "${BAMBU_LOG_LEVEL:-INFO}"
    expose:
      - "9208"
    volumes:
      - bambu-config:/config
      - bambu-data:/var/lib/bambu-control
    read_only: true
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:9208/healthz", timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      bambu-control:
        condition: service_healthy
    environment:
      BAMBU_SITE_HOST: "${BAMBU_SITE_HOST:-localhost}"
      BAMBU_HTTPS_PORT: "${BAMBU_HTTPS_PORT:-9444}"
    ports:
      - "${BAMBU_BIND_ADDRESS:-127.0.0.1}:${BAMBU_HTTPS_PORT:-9444}:${BAMBU_HTTPS_PORT:-9444}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  bambu-config:
  bambu-data:
  caddy-data:
  caddy-config:
