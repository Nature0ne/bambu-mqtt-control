name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Python lint
        run: ruff check app tests

  frontend:
    name: Frontend and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/login.js
          node --check app/static/manage.js
          node --check app/static/setup.js
      - name: Shell syntax
        run: |
          for script in scripts/*; do
            sh -n "$script"
          done

  container:
    name: Container and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate published-image deployment
        run: docker compose config --quiet
      - name: Validate local-build deployment
        run: docker compose -f compose.yaml -f deploy/compose.build.yaml config --quiet
      - name: Validate external-proxy deployment
        run: docker compose -f deploy/compose.external-proxy.yaml config --quiet
      - name: Build local image
        run: >-
          docker compose -f compose.yaml -f deploy/compose.build.yaml
          build bambu-control
