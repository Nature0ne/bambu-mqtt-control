name: Feature request
description: Propose a safe, model-aware improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Never include access codes, passwords, serial numbers, private camera
        URLs, IP addresses, or unredacted MQTT payloads.
  - type: textarea
    id: value
    attributes:
      label: User value
      description: What problem should the feature solve?
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Printer and AMS model
      placeholder: X1C with AMS 2 Pro
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and protocol evidence
      description: >-
        Link public protocol references and describe required model, capability,
        state, and permission gates. Do not paste credential-bearing data.
